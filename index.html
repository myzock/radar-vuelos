<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Radar de vuelos</title>
<meta name="description" content="Radar de vuelos en vivo con datos ADS-B: rutas, seguimiento, alertas y mapa de cualquier lugar del mundo. Pensado para tablets y pantallas redondas.">
<!-- Vista previa al compartir el link (Twitter/X, WhatsApp, etc.) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://radar-vuelos-sigma.vercel.app/">
<meta property="og:title" content="Radar de vuelos en vivo">
<meta property="og:description" content="Aviones en tiempo real con su ruta, seguimiento y alertas, sobre un mapa de cualquier lugar del mundo.">
<meta property="og:image" content="https://radar-vuelos-sigma.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Radar de vuelos en vivo">
<meta name="twitter:description" content="Aviones en tiempo real con su ruta, seguimiento y alertas, sobre un mapa de cualquier lugar del mundo.">
<meta name="twitter:image" content="https://radar-vuelos-sigma.vercel.app/og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<!-- Los textos con data-t se traducen al cargar (ver TEXTOS en app.js) -->
<div id="app">
  <div id="zona-radar">
    <canvas id="capa-fondo" class="capa"></canvas>
    <canvas id="capa-estelas" class="capa"></canvas>
    <canvas id="capa-barrido"></canvas>
    <canvas id="capa-borde" class="capa"></canvas>
    <canvas id="radar" class="capa"></canvas>
    <!-- Escala de colores por altitud (se completa desde app.js según unidades e idioma) -->
    <div id="leyenda" class="leyenda"></div>
    <!-- Controles para pantallas redondas (modo ?redondo) -->
    <div id="r-ui">
      <div class="r-arriba"><span id="r-estado" class="pill cargando">…</span><span id="r-reloj">--:--</span></div>
      <div id="r-detalle" class="r-detalle oculto"></div>
      <div class="r-abajo"><button id="r-rango">50 KM</button><button id="r-aj">⚙</button></div>
    </div>
  </div>
  <aside id="panel">
    <header>
      <div class="hora"><span id="reloj">--:--</span><span id="zona-horaria"></span></div>
      <div class="estado">
        <span id="pill" class="pill cargando" data-t="cargando">Conectando</span>
        <span id="fuente"></span>
      </div>
    </header>
    <div id="rangos" class="rangos"></div>
    <section id="detalle" class="detalle vacio" data-t="tocaAvion">Tocá un avión para ver el detalle</section>
    <form id="buscar" class="buscar" autocomplete="off">
      <input type="search" id="buscar-q" data-tp="buscarPh" placeholder="Buscar vuelo o matrícula" spellcheck="false" autocapitalize="characters">
      <button type="submit">🔍</button>
    </form>
    <div class="lista-titulo"><span data-t="enRadar">En el radar</span><span id="contador">0</span></div>
    <ul id="lista"></ul>
    <footer>
      <button id="btn-ubic" data-t="btnUbic">📍 Ubicación</button>
      <button id="btn-aj" data-t="btnAj">⚙ Ajustes</button>
      <button id="btn-full" data-t="btnFull">⛶ Completa</button>
    </footer>
  </aside>
</div>
<div id="alerta" class="alerta oculto"></div>
<div id="noche"></div>
<div id="ajustes" class="ajustes oculto">
  <div class="caja">
    <h2 data-t="ajTitulo">Ajustes</h2>
    <label class="fila"><input type="checkbox" id="aj-tierra"> <span data-t="ajTierra">Ocultar aviones en tierra</span></label>
    <label class="fila"><span data-t="ajAlt">Altitud máxima</span>
      <select id="aj-alt"><option value="0" data-t="altTodas">Todas</option><option value="10000" data-t="alt10k">Hasta 3.000 m</option><option value="5000" data-t="alt5k">Hasta 1.500 m</option></select>
    </label>
    <label class="fila"><span data-t="ajUnidades">Unidades</span>
      <select id="aj-unidades"><option value="metrico" data-t="uniMetrico">Métricas (m, km/h)</option><option value="aviacion" data-t="uniAviacion">Aviación (pies, nudos)</option></select>
    </label>
    <label class="fila"><span data-t="ajNoche">Modo noche</span>
      <select id="aj-noche"><option value="auto" data-t="auto">Automático</option><option value="si" data-t="nocheSi">Siempre</option><option value="no" data-t="nocheNo">Nunca</option></select>
    </label>
    <label class="fila"><span data-t="ajHorario">Horario automático</span>
      <span><input type="number" id="aj-desde" min="0" max="23"> <span data-t="hastaH">a</span> <input type="number" id="aj-hasta" min="0" max="23"> h</span>
    </label>
    <label class="fila"><input type="checkbox" id="aj-sonido"> <span data-t="ajSonido">Sonido en alertas</span></label>
    <label class="fila"><span data-t="ajIdioma">Idioma</span>
      <select id="aj-idioma"><option value="auto" data-t="auto">Automático</option><option value="es">Español</option><option value="en">English</option></select>
    </label>
    <label class="col"><span data-t="ajVigilar">Avisarme cuando aparezca (tipos, matrículas o aerolíneas, separados por coma)</span>
      <input type="text" id="aj-vigilar" spellcheck="false" autocomplete="off">
    </label>
    <button id="aj-centro" type="button" data-t="ajCentro">📌 Elegir el centro tocando el radar</button>
    <p class="nota" data-t="ajNota">Ejemplos: A388 (tipo), LV-FNI (matrícula), KLM (aerolínea). Las emergencias (7700/7600/7500) se avisan siempre.</p>
    <button id="aj-cerrar" class="activo" data-t="listo">Listo</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
